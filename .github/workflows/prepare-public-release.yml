name: Prepare signed Play Protect candidate

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: prepare-public-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  preflight:
    name: Require main-branch dispatch
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Reject non-main dispatches
        run: |
          test "$GITHUB_REF" = "refs/heads/main" || {
            echo "Prepare signed Play Protect candidate must be dispatched from main" >&2
            exit 1
          }

  prepare:
    name: Build private signed candidate
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 40
    environment: public-release-signing

    steps:
      - name: Check out candidate source
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: main
          fetch-depth: 0

      - name: Require the current main HEAD
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          SOURCE_COMMIT="$(git rev-parse HEAD)"
          MAIN_COMMIT="$(git rev-parse origin/main)"
          test "$SOURCE_COMMIT" = "$MAIN_COMMIT" || {
            echo "Signing is allowed only for the current origin/main HEAD" >&2
            exit 1
          }

      - name: Set up JDK 17
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6

      - name: Validate signing secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          SIGNING_CERT_SHA256: ${{ secrets.ANDROID_SIGNING_CERT_SHA256 }}
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_BASE64" || { echo "Missing ANDROID_KEYSTORE_BASE64" >&2; exit 1; }
          test -n "$KEYSTORE_PASSWORD" || { echo "Missing ANDROID_KEYSTORE_PASSWORD" >&2; exit 1; }
          test -n "$KEY_ALIAS" || { echo "Missing ANDROID_KEY_ALIAS" >&2; exit 1; }
          test -n "$KEY_PASSWORD" || { echo "Missing ANDROID_KEY_PASSWORD" >&2; exit 1; }
          test -n "$SIGNING_CERT_SHA256" || { echo "Missing ANDROID_SIGNING_CERT_SHA256" >&2; exit 1; }

      - name: Restore release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/hesabyar-release.jks"

      - name: Test, lint, and build private signed candidate
        env:
          HESABYAR_KEYSTORE_PATH: ${{ runner.temp }}/hesabyar-release.jks
          HESABYAR_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          HESABYAR_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          HESABYAR_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew clean testDebugUnitTest lintDebug assembleDebugAndroidTest assemblePublicRelease --stacktrace

      - name: Verify and package private candidate
        id: package
        env:
          EXPECTED_CERT_SHA256: ${{ secrets.ANDROID_SIGNING_CERT_SHA256 }}
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/release/app-release.apk"
          test -f "$APK"

          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -n "$APKSIGNER" || { echo "Unable to locate apksigner" >&2; exit 1; }
          SIGNATURE_REPORT="$("$APKSIGNER" verify --verbose --print-certs "$APK")"
          printf '%s\n' "$SIGNATURE_REPORT"
          printf '%s\n' "$SIGNATURE_REPORT" | grep -Fxq 'Verified using v2 scheme (APK Signature Scheme v2): true' || {
            echo "Release APK must use APK Signature Scheme v2" >&2
            exit 1
          }
          printf '%s\n' "$SIGNATURE_REPORT" | grep -Fxq 'Number of signers: 1' || {
            echo "Release APK must have exactly one signer" >&2
            exit 1
          }
          ACTUAL_CERT_SHA256="$(printf '%s\n' "$SIGNATURE_REPORT" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' | tr -d '[:space:]:' | tr '[:upper:]' '[:lower:]')"
          EXPECTED_CERT_SHA256_NORMALIZED="$(printf '%s' "$EXPECTED_CERT_SHA256" | tr -d '[:space:]:' | tr '[:upper:]' '[:lower:]')"
          test "$ACTUAL_CERT_SHA256" = "$EXPECTED_CERT_SHA256_NORMALIZED" || { echo "Unexpected release signer" >&2; exit 1; }

          AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -n 1)"
          test -n "$AAPT" || { echo "Unable to locate aapt" >&2; exit 1; }
          BADGING="$("$AAPT" dump badging "$APK")"
          PACKAGE_LINE="$(printf '%s\n' "$BADGING" | sed -n '/^package:/p' | head -n 1)"
          ACTUAL_PACKAGE="$(printf '%s' "$PACKAGE_LINE" | sed -n "s/^package: name='\([^']*\)'.*/\1/p")"
          ACTUAL_VERSION_NAME="$(printf '%s' "$PACKAGE_LINE" | sed -n "s/.*versionName='\([^']*\)'.*/\1/p")"
          ACTUAL_VERSION_CODE="$(printf '%s' "$PACKAGE_LINE" | sed -n "s/.*versionCode='\([^']*\)'.*/\1/p")"
          ACTUAL_MIN_SDK="$(printf '%s' "$BADGING" | sed -n "s/^sdkVersion:'\([^']*\)'.*/\1/p")"
          ACTUAL_TARGET_SDK="$(printf '%s' "$BADGING" | sed -n "s/^targetSdkVersion:'\([^']*\)'.*/\1/p")"

          test "$ACTUAL_PACKAGE" = "com.hesabyar.garage" || { echo "Unexpected application ID" >&2; exit 1; }
          test "$ACTUAL_MIN_SDK" = "26" || { echo "Unexpected minSdk" >&2; exit 1; }
          test "$ACTUAL_TARGET_SDK" = "36" || { echo "Unexpected targetSdk" >&2; exit 1; }
          PERMISSION_REPORT="$("$AAPT" dump permissions "$APK")"
          printf '%s\n' "$PERMISSION_REPORT"
          printf '%s\n' "$PERMISSION_REPORT" | bash scripts/verify-apk-permissions.sh "$ACTUAL_PACKAGE"

          TAG_NAME="v${ACTUAL_VERSION_NAME}"
          test -f "release/${TAG_NAME}/VERSION_CODE.txt" || { echo "Missing version-code record" >&2; exit 1; }
          EXPECTED_VERSION_CODE="$(tr -d '[:space:]' < "release/${TAG_NAME}/VERSION_CODE.txt")"
          test "$ACTUAL_VERSION_CODE" = "$EXPECTED_VERSION_CODE" || { echo "Unexpected versionCode" >&2; exit 1; }
          test -f "release/${TAG_NAME}/RELEASE_NOTES.md" || { echo "Missing release notes" >&2; exit 1; }

          ZIPALIGN="$(find "$ANDROID_HOME/build-tools" -type f -name zipalign | sort -V | tail -n 1)"
          test -n "$ZIPALIGN" || { echo "Unable to locate zipalign" >&2; exit 1; }
          "$ZIPALIGN" -c -P 16 -v 4 "$APK"

          APK_SHA256="$(sha256sum "$APK" | awk '{print $1}')"
          SOURCE_COMMIT="$(git rev-parse HEAD)"
          ARTIFACT_NAME="hesabyar-public-candidate-${TAG_NAME}-${GITHUB_RUN_ID}"
          mkdir -p candidate
          cp "$APK" "candidate/HesabYar-Garage-${TAG_NAME}.apk"
          {
            printf 'CANDIDATE_RUN_ID=%s\n' "$GITHUB_RUN_ID"
            printf 'CANDIDATE_ARTIFACT_NAME=%s\n' "$ARTIFACT_NAME"
            printf 'SOURCE_COMMIT=%s\n' "$SOURCE_COMMIT"
            printf 'APK_SHA256=%s\n' "$APK_SHA256"
            printf 'PACKAGE_NAME=%s\n' "$ACTUAL_PACKAGE"
            printf 'VERSION_NAME=%s\n' "$ACTUAL_VERSION_NAME"
            printf 'VERSION_CODE=%s\n' "$ACTUAL_VERSION_CODE"
            printf 'SIGNER_CERT_SHA256=%s\n' "$ACTUAL_CERT_SHA256"
          } > candidate/CANDIDATE_METADATA.env
          (cd candidate && sha256sum *.apk > SHA256SUMS.txt)

          echo "artifact_name=$ARTIFACT_NAME" >> "$GITHUB_OUTPUT"
          echo "apk_sha256=$APK_SHA256" >> "$GITHUB_OUTPUT"
          echo "source_commit=$SOURCE_COMMIT" >> "$GITHUB_OUTPUT"

      - name: Upload private candidate artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.package.outputs.artifact_name }}
          path: candidate/
          if-no-files-found: error
          retention-days: 90
          compression-level: 0

      - name: Candidate handoff
        run: |
          printf '%s\n' \
            "Artifact: ${{ steps.package.outputs.artifact_name }}" \
            "Run ID: ${GITHUB_RUN_ID}" \
            "Source commit: ${{ steps.package.outputs.source_commit }}" \
            "APK SHA-256: ${{ steps.package.outputs.apk_sha256 }}" \
            "Download this exact private artifact, complete VirusTotal/Play Protect review, then record these values before tagging."

      - name: Remove signing material
        if: always()
        run: rm -f "$RUNNER_TEMP/hesabyar-release.jks"
